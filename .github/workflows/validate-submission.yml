# Validates listing submissions opened via the "Submit a listing" issue form.
#
# SECURITY: everything a submitter types (title, body, form fields) is hostile.
# Issue-derived data only ever enters `run:` / github-script bodies via `env:`
# indirection — never via `${{ }}` interpolation inside the script text.
name: Validate submission

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: validate-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'listing-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PNPM
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Parse issue form
        id: parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/submit-listing.yml
          issue-body: ${{ github.event.issue.body }}

      - name: Spam gate
        uses: actions/github-script@v7
        with:
          script: |
            // All submitter data is read from the typed `context` object in
            // JS — never interpolated into this script's source text.
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const user = context.payload.issue.user;

            const reject = async () => {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: [
                  "**Submission not accepted by automated checks.**",
                  "",
                  "One of the following applies: the submitting account is a bot,",
                  "is less than 7 days old, or has opened more than 5 issues in",
                  "the last 24 hours. If you believe this is a mistake, ask a",
                  "maintainer on Discord.",
                ].join("\n"),
              });
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: ["needs-changes"],
              });
              core.setFailed("Submission rejected by the spam gate.");
            };

            if (user.type === "Bot") {
              await reject();
              return;
            }

            const { data: profile } = await github.rest.users.getByUsername({
              username: user.login,
            });
            const accountAgeMs = Date.now() - new Date(profile.created_at).getTime();
            if (accountAgeMs < 7 * 24 * 60 * 60 * 1000) {
              await reject();
              return;
            }

            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const { data: recent } = await github.rest.issues.listForRepo({
              owner,
              repo,
              creator: user.login,
              state: "all",
              since,
              per_page: 100,
            });
            const recentIssues = recent.filter(
              (item) => !item.pull_request && new Date(item.created_at) >= new Date(since),
            );
            if (recentIssues.length > 5) {
              await reject();
            }

      - name: Parse and validate submission
        id: parse
        env:
          # Hostile data enters ONLY through env vars, never `${{ }}` in `run:`.
          PARSED_ISSUE: ${{ steps.parser.outputs.jsonString }}
          SUBMITTED_BY: ${{ github.event.issue.user.login }}
        run: |
          set -o pipefail
          export TODAY="$(date -u +%Y-%m-%d)"
          set +e
          # pnpm may print an install banner to stdout; the script's JSON
          # verdict is always the last line.
          RESULT="$(pnpm exec tsx scripts/parse-submission.ts | tail -n 1)"
          CODE=$?
          set -e
          if [ -z "$RESULT" ]; then
            RESULT='{"ok":false,"errors":["internal: the submission parser produced no output"]}'
            CODE=1
          fi
          {
            echo "result=$RESULT"
            if [ "$CODE" -eq 0 ]; then echo "ok=true"; else echo "ok=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Comment outcome and swap labels
        uses: actions/github-script@v7
        env:
          # Script output only: constant error strings plus the zod-constrained
          # kebab-case slug. Still passed via env, not interpolated.
          RESULT: ${{ steps.parse.outputs.result }}
        with:
          script: |
            let result;
            try {
              result = JSON.parse(process.env.RESULT);
            } catch {
              result = {
                ok: false,
                errors: ["internal: could not read the validation result"],
              };
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            const body = result.ok
              ? [
                  "**Validation passed.**",
                  "",
                  "This submission will be added as `" + result.slug + "`.",
                  "",
                  "A maintainer can now approve with `/approve` (or decline with `/reject`).",
                ].join("\n")
              : [
                  "**Validation failed.** Edit the issue to fix the following and validation will re-run:",
                  "",
                  ...result.errors.map((error) => "- " + error),
                ].join("\n");

            await github.rest.issues.createComment({ owner, repo, issue_number, body });

            const addLabel = result.ok ? "validated" : "needs-changes";
            const removeLabel = result.ok ? "needs-changes" : "validated";
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [addLabel],
            });
            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: removeLabel,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (!result.ok) {
              core.setFailed("Submission failed validation.");
            }
