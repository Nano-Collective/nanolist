# Thin caller for the shared org checks (lint, format, types, knip, tests +
# coverage, build, audit, Semgrep, CodeQL) — see
# https://docs.nanocollective.org/collective/projects/project-infrastructure —
# plus the Nanolist-specific jobs: listing data validation and a guard that
# keeps bot-created submission branches from touching anything other than
# listing data.
name: Pull Request Automated Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  pr-checks:
    uses: Nano-Collective/.github/.github/workflows/pr-checks.yml@main

  # Listing data is the product. Validate every data/listings/*.json against
  # the schema and assert the issue templates are in sync with the taxonomy.
  validate-listings:
    name: Validate Listings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate listings and template sync
        run: pnpm validate

  # Submission PRs are created by automation from hostile submitter input.
  # They may only ever add listing JSON and icons — anything else fails.
  submission-guard:
    if: startsWith(github.head_ref, 'submission/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Only listing and icon files may change
        # github.base_ref is passed through env rather than interpolated into
        # the script, so no expression expansion happens inside run. No
        # submitter-controlled value reaches this script at all.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          CHANGED="$(git diff --name-only "origin/${BASE_REF}...")"
          echo "Changed files:"
          # Indent when printing so file names can never be parsed as
          # ::workflow-commands:: (which must start at column 0).
          printf '%s\n' "$CHANGED" | sed 's/^/  /'
          BAD="$(printf '%s\n' "$CHANGED" \
            | grep -v '^$' \
            | grep -Ev '^data/listings/[a-z0-9-]+\.json$|^public/icons/' \
            || true)"
          if [ -n "$BAD" ]; then
            echo "::error::Submission PRs may only change data/listings/*.json and public/icons/ files."
            echo "Disallowed paths:"
            printf '%s\n' "$BAD" | sed 's/^/  /'
            exit 1
          fi
