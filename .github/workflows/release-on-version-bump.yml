# Cuts a GitHub Release (tag v<version>) whenever the version in package.json
# lands on main without a matching release. Releases exist solely so the docs
# site can resolve documentation versions from release tags — deployment is
# handled independently by deploy-cloudflare-pages.yaml and never waits on, or
# is gated by, this workflow.
name: Release on Version Bump

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-on-version-bump
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do"
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nanolist $TAG" \
            --generate-notes
          echo "Created release $TAG"
